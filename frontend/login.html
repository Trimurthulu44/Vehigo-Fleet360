<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Owner Login — VEHIGO Fleet Management Platform</title>
    <link rel="stylesheet" href="css/style.css?v=2.0">
</head>
<body class="login-body">
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="login-brand-icon">V</div>
                <h1 class="login-brand-title">VEHIGO</h1>
                <p class="login-brand-subtitle">Welcome back to your fleet.</p>
            </div>

            <div id="login-error" class="login-error-msg" style="display: none;">
                Invalid username or password
            </div>

            <form id="login-form" class="login-form">
                <div class="form-group">
                    <label for="businessName">Business / Company Name (Optional)</label>
                    <div class="input-with-icon">
                        <svg viewBox="0 0 24 24" class="input-icon"><path d="M3 21h18"></path><path d="M19 21v-4a2 2 0 0 0-2-2H7a2 2 0 0 0-2 2v4"></path><path d="M5 21V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16"></path></svg>
                        <input type="text" id="businessName" class="form-control" placeholder="e.g. ABC Logistics">
                    </div>
                </div>

                <div class="form-group">
                    <label for="username">Username / Email *</label>
                    <div class="input-with-icon">
                        <svg viewBox="0 0 24 24" class="input-icon"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                        <input type="text" id="username" class="form-control" placeholder="Enter registered username or email" required autofocus>
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Password *</label>
                    <div class="input-with-icon password-input-wrapper">
                        <svg viewBox="0 0 24 24" class="input-icon"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                        <input type="password" id="password" class="form-control" placeholder="Enter password" required>
                        <button type="button" id="toggle-password-btn" class="toggle-password-btn" title="Show/Hide Password" aria-label="Toggle password visibility">
                            <svg id="eye-icon" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                        </button>
                    </div>
                </div>

                <div class="login-demo-hint">
                    <span>Demo Accounts:</span> <code>admin</code> / <code>admin123</code> or your Subscribed Account.
                </div>

                <button type="submit" class="btn btn-primary btn-block btn-login">
                    <span>LOGIN</span>
                    <svg viewBox="0 0 24 24" width="18" height="18" style="stroke: currentColor; fill: none; stroke-width: 2;"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
                </button>
            </form>

            <div style="text-align: center; margin-top: 0.5rem;">
                <a href="home.html" style="color: var(--accent-cyan); text-decoration: none; font-size: 0.85rem;">← Back to Home / Explore Subscription Plans</a>
            </div>

            <footer class="login-footer">
                Developed by @Valteti Trimurthulu
            </footer>
        </div>
    </div>

    <script src="js/api.js?v=2.0"></script>
    <script src="js/auth.js?v=2.0"></script>
</body>
</html>
