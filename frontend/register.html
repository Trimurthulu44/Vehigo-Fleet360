<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Registration — VEHIGO SaaS Platform</title>
    <link rel="stylesheet" href="css/style.css?v=6.0">
</head>
<body class="public-body">

    <!-- Header Navbar -->
    <header class="public-header">
        <div class="public-header-container">
            <a href="home.html" class="brand-link">
                <div class="brand-icon">V</div>
                <div class="brand-text">VEHIGO <span class="saas-badge">SaaS</span></div>
            </a>
            <div class="public-auth-btns">
                <a href="login.html" class="btn btn-secondary">Owner Login</a>
            </div>
        </div>
    </header>

    <!-- Registration Form Container -->
    <div class="registration-container">
        <div class="registration-card">
            <div class="registration-header">
                <h1 class="registration-title">Register Your Business</h1>
                <p class="registration-subtitle">Create your VEHIGO account and start managing your fleet operations.</p>
            </div>

            <!-- Selected Subscription Plan Badge -->
            <div class="plan-summary-box">
                <div>
                    <span class="plan-summary-label">Selected Subscription Plan:</span>
                    <h3 id="summary-plan-title" class="plan-summary-title">1 Year Plan</h3>
                </div>
                <div id="summary-plan-price" class="plan-summary-amount">₹4,999</div>
            </div>

            <div id="register-error" class="login-error-msg" style="display: none;"></div>

            <form id="registration-form" class="registration-form" onsubmit="return handleRegisterFormSubmit(event)">
                <input type="hidden" id="selected-plan-input" value="1_YEAR">

                <!-- Section 1: Business Details -->
                <div class="form-section">
                    <h2 class="form-section-title">1. Business Details</h2>
                    <div class="form-grid">
                        <div class="form-group full-width">
                            <label for="businessName">Business / Company Name *</label>
                            <input type="text" id="businessName" class="form-control" placeholder="e.g. ABC Express Logistics" required>
                        </div>
                        <div class="form-group">
                            <label for="businessType">Business Type *</label>
                            <select id="businessType" class="form-control" required>
                                <option value="Transport">Transport</option>
                                <option value="Logistics">Logistics</option>
                                <option value="Travel">Travel & Tour</option>
                                <option value="School/College Transport">School / College Transport</option>
                                <option value="Delivery">Delivery Services</option>
                                <option value="Rental">Rental Vehicles</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="businessRegNumber">Reg Number (Optional)</label>
                            <input type="text" id="businessRegNumber" class="form-control" placeholder="e.g. REG-2024-9988">
                        </div>
                        <div class="form-group">
                            <label for="vehicleCount">Number of Vehicles</label>
                            <input type="number" id="vehicleCount" class="form-control" placeholder="10" min="1" max="1000" value="10">
                        </div>
                        <div class="form-group">
                            <label for="location">Business Location</label>
                            <input type="text" id="location" class="form-control" placeholder="e.g. Chennai, Tamil Nadu">
                        </div>
                    </div>
                </div>

                <!-- Section 2: Owner Details -->
                <div class="form-section">
                    <h2 class="form-section-title">2. Owner Details</h2>
                    <div class="form-grid">
                        <div class="form-group full-width">
                            <label for="ownerName">Owner Full Name *</label>
                            <input type="text" id="ownerName" class="form-control" placeholder="e.g. Rajesh Sharma" required>
                        </div>
                        <div class="form-group">
                            <label for="ownerEmail">Owner Email Address *</label>
                            <input type="email" id="ownerEmail" class="form-control" placeholder="e.g. owner@example.com" required>
                        </div>
                        <div class="form-group">
                            <label for="phone">Mobile Number *</label>
                            <input type="tel" id="phone" class="form-control" placeholder="e.g. +91 9876543210" required>
                        </div>
                    </div>
                </div>

                <!-- Section 3: Account Credentials -->
                <div class="form-section">
                    <h2 class="form-section-title">3. Account Credentials</h2>
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="username">Preferred Username *</label>
                            <input type="text" id="username" class="form-control" placeholder="e.g. abclogistics" required>
                        </div>
                        <div class="form-group">
                            <label for="password">Password *</label>
                            <input type="password" id="password" class="form-control" placeholder="Choose password" required>
                        </div>
                    </div>
                </div>

                <div class="registration-actions">
                    <a href="home.html#pricing" class="btn btn-secondary">Change Plan</a>
                    <button type="submit" onclick="return handleRegisterFormSubmit(event)" class="btn btn-primary btn-lg" style="flex: 1; justify-content: center;">
                        <span>Continue to Payment</span>
                        <svg viewBox="0 0 24 24" width="18" height="18" style="stroke: currentColor; fill: none; stroke-width: 2;"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Page Footer -->
    <footer class="app-footer">
        Developed by @Valteti Trimurthulu
    </footer>

    <script src="js/api.js?v=6.0"></script>
    <script src="js/register.js?v=6.0"></script>
    <script>
        function handleRegisterFormSubmit(e) {
            if (e) {
                e.preventDefault();
                e.stopPropagation();
            }

            const businessName = (document.getElementById('businessName')?.value || 'My Transport Business').trim();
            const username = (document.getElementById('username')?.value || 'owner').trim();

            const tempId = 'SUB-' + Math.floor(Math.random() * 1000000);
            sessionStorage.setItem('last_sub_id', tempId);
            sessionStorage.setItem('last_reg_user', username);
            sessionStorage.setItem('last_reg_biz', businessName);
            localStorage.setItem('last_reg_user', username);
            localStorage.setItem('last_reg_biz', businessName);

            // INSTANT 0ms REDIRECT TO PAYMENT CHECKOUT PAGE
            window.location.href = `payment.html?id=${tempId}`;
            return false;
        }
    </script>
</body>
</html>
