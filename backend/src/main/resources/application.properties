# VEHIGO Backend Configuration
spring.application.name=vehigo-backend
server.port=8080

# MongoDB Configuration (Supports local MongoDB and cloud MongoDB Atlas URI via environment variable)
spring.data.mongodb.database=vehigo_db
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:${MONGODB_URI:mongodb://localhost:27017/vehigo_db}}

# Mail Configuration (Optional SMTP - Falls back to logging if unconfigured)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Logging Configuration
logging.level.com.vehigo=INFO
logging.level.org.springframework.data.mongodb=INFO

# JSON Formatting
spring.jackson.serialization.indent-output=true
spring.jackson.default-property-inclusion=non_null
